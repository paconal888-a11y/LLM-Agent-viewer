[project]
name = "local-agent-lab"
version = "0.4.0"
description = "A local agent harness learning and evaluation project"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
reference = ["torch==2.8.0", "transformers==4.57.3"]
integrations = ["python-lsp-server[pyflakes]==1.15.0"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
