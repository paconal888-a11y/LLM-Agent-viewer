name: Python tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test tests/architecture.test.cjs tests/inspection.test.cjs tests/editor.test.cjs tests/settings.test.cjs tests/export_search.test.cjs tests/lessons.test.cjs
  windows:
    # 공식 설치 경로(Windows 런처)와 CRLF 체크아웃을 검증한다. test_launcher는 실제 Windows PowerShell을 실행한다.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --python 3.12 --extra integrations --locked
      - name: Python tests
        shell: pwsh
        run: |
          uv run --extra integrations --offline python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath test-output.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # 로그는 로그인해야 보이지만 주석은 공개된다. 실패한 테스트 이름과 예외를 주석으로 남긴다.
            Select-String -Path test-output.txt -Pattern '^(ERROR|FAIL): ' | ForEach-Object { Write-Output "::error::$($_.Line)" }
            Select-String -Path test-output.txt -Pattern '^[A-Za-z_.]*(Error|Exception|Failure)\b' | Select-Object -First 15 | ForEach-Object { Write-Output "::warning::$($_.Line)" }
          }
          exit $code
      - name: 설치 안내대로 샘플 보기 시작
        shell: pwsh
        timeout-minutes: 5
        run: |
          # 로그는 로그인해야 보이지만 주석은 공개된다. 실패하면 마지막 출력과 앱 오류를 주석으로 남긴다.
          function Note-Failure([string]$title, $lines) {
            Write-Output "::error::$title"
            @($lines) | Where-Object { $_ } | Select-Object -Last 8 | ForEach-Object { Write-Output "::warning::$_" }
            if (Test-Path .local/app.stderr.log) { Get-Content .local/app.stderr.log -Tail 6 | ForEach-Object { Write-Output "::warning::$_" } }
            exit 1
          }
          # 뒤에 남는 앱이 출력 파이프를 물려받으므로 파이프로 읽으면 끝나지 않는다. 파일로 받는다.
          cmd /c ".\Start-AgentLens.cmd -SamplesOnly -NoBrowser -Port 8799 > launcher.log 2>&1"
          $code = $LASTEXITCODE
          $output = Get-Content launcher.log
          $output
          if ($code -ne 0) { Note-Failure "Start-AgentLens.cmd exit code $code" $output }
          try {
            $status = Invoke-RestMethod http://127.0.0.1:8799/api/status
            if ($status.mode -ne 'sample') { throw "unexpected mode: $($status.mode)" }
            # Invoke-RestMethod는 JSON 배열을 객체 하나로 내보내므로 @()로 감싸면 항목 수가 1이 된다.
            $samples = Invoke-RestMethod http://127.0.0.1:8799/api/samples
            if ($samples.Count -lt 16) { throw "samples missing: $($samples.Count)" }
          } catch { Note-Failure "API check failed: $($_.Exception.Message)" $output }
          # 앱이 살아 있는 동안 launcher.log는 앱이 열고 있으므로 다른 파일에 받는다.
          cmd /c ".\Stop-AgentLens.cmd > launcher-stop.log 2>&1"
          $code = $LASTEXITCODE
          $output = Get-Content launcher-stop.log
          $output
          if ($code -ne 0) { Note-Failure "Stop-AgentLens.cmd exit code $code" $output }
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test tests/architecture.test.cjs tests/inspection.test.cjs tests/editor.test.cjs tests/settings.test.cjs tests/export_search.test.cjs tests/lessons.test.cjs
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --extra reference --extra integrations --locked
      - run: uv run --extra reference --extra integrations --offline python -m unittest discover -s tests -v
